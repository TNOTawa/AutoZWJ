全部：按全局物件顺序计数；图层：仅按当前图层内物件计数=All: counts by global object index; Layer: counts only within the current layer
关闭节拍对齐：物件按音符起始帧放置，不吸附 BPM 节拍=Disables beat alignment: objects are placed at note start frames without snapping to the BPM grid

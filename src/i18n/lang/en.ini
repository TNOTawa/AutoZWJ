优化模式：复用已结束的图层紧凑排列；持续累加模式：始终追加新图层；交替换行：奇偶物件分到不同图层组=Optimize: reuses finished layers for compact layout; Accumulate: always appends new layers; Alternate Line: splits odd/even objects into different layer groups
全部独立：每个音符生成一个物件；仅取第N轨/倒数第N轨：仅保留层分配后第 N 层或倒数第 N 层的物件=All Independent: one object per note; Nth/Last Nth Track Only: keeps only the Nth or last-Nth layer after layer assignment


全部独立：每个音符生成一个物件；仅取第N轨/倒数第N轨：仅保留层分配后第 N 层或倒数第 N 层的物件=すべて独立：ノートごとに1オブジェクト生成。N番目のみ/後ろからN番目のみ：レイヤー割り当て後の第N層または後ろからN番目の層のみ残す

